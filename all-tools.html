<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tools | Yahallo Games</title>
    <meta name="description" content="Browse all games by Yahallo Games.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://yahallogames.site/all-games.html">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon_io/site.webmanifest">
    <link rel="shortcut icon" href="assets/favicon_io/favicon.ico">
    <link rel="stylesheet" href="fontawesome-free-7.1.0-web/css/all.min.css">
    <link rel="stylesheet" href="all-games.css">
</head>
<body>
    <script>
        if (location.protocol === "http:" && location.hostname === "yahallogames.site") {
            location.replace(`https://${location.host}${location.pathname}${location.search}${location.hash}`);
        }
    </script>

    <main class="all-games-page">
        <header class="all-games-header">
            <div>
                <h1>All Tools</h1>
                <p class="all-games-subtitle">Tools from Yahallo Games.</p>
            </div>
            <a href="index.html" class="back-home-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>
        </header>

        <section class="all-games-grid" aria-label="All Yahallo games">

            <article class="all-game-card">
                <a href="https://yahallogames.itch.io/grayscale-preview-aseprite-extension" target="_blank" rel="noopener noreferrer" data-track="all_games_click" data-game="grayscale-preview" data-platform="itch">
                    <img src="Images/GrayscalePreview.png" alt="Grayscale Preview cover" loading="lazy" decoding="async">
                </a>
                <div class="all-game-content">
                    <h2>Grayscale Preview</h2>
                    <p class="all-game-meta">Itch.io</p>
                    <p>Aseprite extension, preview the grayscale of your work.</p>
                </div>
            </article>


            <article class="all-game-card">
                <a href="https://yahallogames.itch.io/normal-map-preview-aseprite-extension" target="_blank" rel="noopener noreferrer" data-track="all_games_click" data-game="normal-maps-preview" data-platform="itch">
                    <img src="Images/NormalMaps Preview.png" alt="Normal Maps Preview cover" loading="lazy" decoding="async">
                </a>
                <div class="all-game-content">
                    <h2>Normal Maps Preview</h2>
                    <p class="all-game-meta">Itch.io</p>
                    <p>Aseprite extension, preview the normal map of your work.</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
