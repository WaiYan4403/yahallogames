<body>
    <div class="blog-container">
        <!-- Home Button -->
        <a href="index.html" class="home-btn">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <!-- Contact Card -->
        <div class="contact-card">
            <h1 class="contact-title">Contact Us</h1>
            <p class="contact-description">
                &nbsp; &nbsp; We are open to partnerships, publishing conversations, and collaboration opportunities.
                Send us a quick inquiry and we will respond by email.
            </p>

            <div class="contact-info">
                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <a href="tel:+959258778559" class="contact-link">+95 9258778559</a>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <a href="mailto:yahallogames@gmail.com" class="contact-link">yahallogames@gmail.com</a>
                </div>
            </div>
<br><br>
            <form id="contactInquiryForm" class="contact-form" novalidate>
                <input type="text" id="company" name="company" tabindex="-1" autocomplete="off" class="contact-honeypot" aria-hidden="true">
                <input type="hidden" id="formStartedAt" name="formStartedAt" value="">
                <div class="contact-form-row">
                    <div class="contact-form-group">
                        <label for="contactName">Name *</label>
                        <input type="text" id="contactName" name="name" required autocomplete="name">
                    </div>
                    <div class="contact-form-group">
                        <label for="contactEmail">Email *</label>
                        <input type="email" id="contactEmail" name="email" required autocomplete="email">
                    </div>
                </div>

                <div class="contact-form-group">
                    <label for="contactType">Inquiry Type *</label>
                    <select id="contactType" name="type" required>
                        <option value="" selected disabled>Select an inquiry type</option>
                        <option value="partnership">Partnership</option>
                        <option value="publisher">Publisher / Investor</option>
                        <option value="freelance">Freelance / Work Opportunity</option>
                        <option value="press">Press / Media</option>
                        <option value="support">Player Support</option>
                    </select>
                </div>

                <div class="contact-form-group">
                    <label for="contactMessage">Message *</label>
                    <textarea id="contactMessage" name="message" rows="6" required placeholder="Tell us what you need and any relevant links."></textarea>
                </div>

                <div class="contact-form-actions">
                    <button type="submit" class="contact-submit-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                        Send Inquiry
                    </button>
                </div>
                <p id="contactFormMessage" class="contact-form-message" aria-live="polite"></p>
            </form>
        </div>
